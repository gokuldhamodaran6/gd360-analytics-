<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GD360 Analytics - connect your data, ask in plain English, and get verified, analyst-grade charts in minutes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>GD360 Analytics</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("gd360_theme");
          var theme = stored === "light" || stored === "dark" ? stored : null;
          if (!theme) {
            var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
            theme = prefersLight ? "light" : "dark";
          }
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-base text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
