<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 2026-10-30 (SEO round): the home page's search and share tags. The site address placeholder is filled in at build time by
         prerender.mjs from VITE_SITE_URL (default: the onrender address), so moving to the live domain is one
         setting. Other public pages set their own title, description and canonical through useMarketingPage.
         The canonical address is added by the small script below, per address: this one file is also what the
         server sends for every other address (/start, /login, ...), so a fixed tag here would point them all home. -->
    <title>Euliv: AI Data Analyst That Proves Every Number</title>
    <meta name="description" content="Ask your warehouse, databases and apps in plain English. Euliv answers with charts and shows the query behind every number. Free in early access." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Euliv" />
    <meta property="og:title" content="Euliv: AI Data Analyst That Proves Every Number" />
    <meta property="og:description" content="The AI data analyst for teams without a data team. Ask in plain English; every number shows its work." />
    <meta property="og:image" content="__SITE_URL__/og-euliv.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Euliv: Every source. One answer. Proven." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Euliv: AI Data Analyst That Proves Every Number" />
    <meta name="twitter:description" content="The AI data analyst for teams without a data team. Ask in plain English; every number shows its work." />
    <meta name="twitter:image" content="__SITE_URL__/og-euliv.jpg" />
    <script>
      (function () {
        try {
          var p = location.pathname.replace(/\/+$/, "") || "/";
          if (["/", "/about", "/start", "/privacy"].indexOf(p) < 0 || document.querySelector('link[rel="canonical"]')) return;
          var u = "__SITE_URL__" + (p === "/" ? "/" : p);
          var l = document.createElement("link"); l.rel = "canonical"; l.href = u; document.head.appendChild(l);
          var m = document.createElement("meta"); m.setAttribute("property", "og:url"); m.content = u; document.head.appendChild(m);
        } catch (err) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#07090A" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Euliv",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/apple-touch-icon.png",
            "founder": { "@type": "Person", "name": "Gokul Dhamodaran", "sameAs": "https://www.linkedin.com/in/gokuldhamodaran/" }
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "name": "Euliv",
            "url": "__SITE_URL__/",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Euliv Analytics",
            "url": "__SITE_URL__/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "AI data analyst that answers plain-English questions across warehouses, databases and business apps, and shows the query behind every number.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Every feature is free during early access" },
            "publisher": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>
    <script>
      (function () {
        try {
          // 2026-10-08: Obsidian (dark) is the default look. A choice saved
          // before then was mostly the old system-following default, so it
          // is asked again once (gd360_theme_v2 marks a choice made since).
          var stored = localStorage.getItem("gd360_theme_v2") ? localStorage.getItem("gd360_theme") : null;
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-base text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
