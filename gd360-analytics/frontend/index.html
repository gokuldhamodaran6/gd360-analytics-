<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GD360 - the AI analyst that shows its work. Ask in plain words across your warehouse, databases and apps, and get answers where every number is proven." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>GD360 Analytics</title>
    <script>
      (function () {
        try {
          // 2026-10-08: Obsidian (dark) is the default look. A choice saved
          // before then was mostly the old system-following default, so it
          // is asked again once (gd360_theme_v2 marks a choice made since).
          var stored = localStorage.getItem("gd360_theme_v2") ? localStorage.getItem("gd360_theme") : null;
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body class="bg-base text-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
