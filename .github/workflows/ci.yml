name: CI Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gd360-analytics/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check every Python file compiles cleanly
        run: |
          find . -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Confirm the app starts and required routes exist
        run: |
          python -c "
          from app.main import app
          paths = [r.path for r in app.routes]
          required = ['/chat', '/admin/stats', '/datasources', '/auth/login', '/auth/register']
          missing = [p for p in required if not any(existing.startswith(p) for existing in paths)]
          assert not missing, f'Missing expected routes: {missing}'
          print(f'OK - {len(app.routes)} routes registered, all required routes present')
          "

  frontend-check:
    name: Frontend (React/TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gd360-analytics/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type check (2 pre-existing unrelated errors in client.ts are expected - watch for NEW ones)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Production build - this is the real pass/fail gate
        run: npm run build
